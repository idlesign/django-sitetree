{% load sitetree %}
{% if sitetree_items|length == 1 %}
{% else %}
<div class="breadcrumbs text-sm">
    <ul>
        {% for item in sitetree_items %}
            {% if not forloop.last %}
                <li><a href="{% sitetree_url for item %}">{{ item.title_resolved }}</a></li>
            {% else %}
                <li>{{ item.title_resolved }}</li>
            {% endif %}
        {% endfor %}
    </ul>
</div>
{% endif %}
